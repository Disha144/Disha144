<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 32" width="100%" height="100%">
  <defs>
    <linearGradient id="hudLaserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f3ff" stop-opacity="0" />
      <stop offset="20%" stop-color="#00f3ff" stop-opacity="1" />
      <stop offset="50%" stop-color="#8000ff" stop-opacity="1" />
      <stop offset="80%" stop-color="#ff007f" stop-opacity="1" />
      <stop offset="100%" stop-color="#ff007f" stop-opacity="0" />
    </linearGradient>
    <filter id="hudGlow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Laser Beam Line -->
  <line x1="40" y1="16" x2="860" y2="16" stroke="url(#hudLaserGrad)" stroke-width="2" filter="url(#hudGlow)" />
  
  <!-- Central Cyber Marker -->
  <rect x="430" y="8" width="40" height="16" rx="4" fill="#060913" stroke="#00f3ff" stroke-width="1.5" filter="url(#hudGlow)" />
  <circle cx="450" cy="16" r="4" fill="#ff007f" filter="url(#hudGlow)" />
  
  <!-- Outer Node Flank Marks -->
  <polygon points="200,12 208,16 200,20" fill="#00f3ff" />
  <polygon points="700,12 692,16 700,20" fill="#ff007f" />
</svg>
