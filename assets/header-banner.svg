<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 240" width="100%" height="100%">
  <defs>
    <!-- Dark Cyber Gradient Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#090d1a" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>

    <!-- Neon Cyan to Purple Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f3ff" />
      <stop offset="50%" stop-color="#bd00ff" />
      <stop offset="100%" stop-color="#00ff9d" />
    </linearGradient>

    <!-- Title Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#00f3ff" />
      <stop offset="100%" stop-color="#bd00ff" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#00f3ff" stroke-width="0.5" stroke-opacity="0.07" />
    </pattern>

    <!-- Glowing Effect Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="850" height="240" rx="12" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2" />
  <rect width="850" height="240" rx="12" fill="url(#cyberGrid)" />

  <!-- Top Terminal Bar -->
  <path d="M 0 12 Q 0 0 12 0 L 838 0 Q 850 0 850 12 L 850 36 L 0 36 Z" fill="#0d1424" fill-opacity="0.8" />
  <circle cx="24" cy="18" r="5" fill="#ff5f56" />
  <circle cx="40" cy="18" r="5" fill="#ffbd2e" />
  <circle cx="56" cy="18" r="5" fill="#27c93f" />
  
  <text x="80" y="22" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#00f3ff" letter-spacing="1.5" font-weight="bold">NOVA // DEVELOPER CONSOLE v2.6</text>
  <text x="730" y="22" font-family="Courier New, monospace" font-size="11" fill="#00ff9d" letter-spacing="1">SYS_STATUS: ONLINE</text>

  <!-- Cyber Corners Accent -->
  <path d="M 20 50 L 40 50 M 20 50 L 20 70" stroke="#00f3ff" stroke-width="2" fill="none" />
  <path d="M 830 50 L 810 50 M 830 50 L 830 70" stroke="#bd00ff" stroke-width="2" fill="none" />
  <path d="M 20 220 L 40 220 M 20 220 L 20 200" stroke="#bd00ff" stroke-width="2" fill="none" />
  <path d="M 830 220 L 810 220 M 830 220 L 830 200" stroke="#00ff9d" stroke-width="2" fill="none" />

  <!-- Main Content -->
  <!-- Developer Name -->
  <text x="50" y="105" font-family="'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="900" fill="url(#textGrad)" letter-spacing="2" filter="url(#glow)">DISHA BODAR</text>
  
  <!-- Subtitle Tagline -->
  <text x="52" y="138" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#a5d6ff" letter-spacing="1">
    AI / ML Engineer • Software Developer • IT Student
  </text>
  
  <!-- Terminal Prompt line -->
  <text x="52" y="172" font-family="Courier New, monospace" font-size="13" fill="#00ff9d">
    &gt; Initializing intelligent systems &amp; full-stack applications... <tspan fill="#00f3ff">| [READY]</tspan>
  </text>

  <!-- Badges Grid at Bottom Right -->
  <g transform="translate(52, 192)">
    <rect width="130" height="26" rx="6" fill="#161b22" stroke="#00f3ff" stroke-width="1" />
    <text x="65" y="17" font-family="sans-serif" font-size="11" fill="#00f3ff" text-anchor="middle" font-weight="bold">⚡ B.Tech IT</text>
  </g>

  <g transform="translate(192, 192)">
    <rect width="150" height="26" rx="6" fill="#161b22" stroke="#bd00ff" stroke-width="1" />
    <text x="75" y="17" font-family="sans-serif" font-size="11" fill="#bd00ff" text-anchor="middle" font-weight="bold">🧠 AI / ML Focus</text>
  </g>

  <g transform="translate(352, 192)">
    <rect width="160" height="26" rx="6" fill="#161b22" stroke="#00ff9d" stroke-width="1" />
    <text x="80" y="17" font-family="sans-serif" font-size="11" fill="#00ff9d" text-anchor="middle" font-weight="bold">💻 Full Stack &amp; Python</text>
  </g>
</svg>
