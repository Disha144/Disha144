<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <!-- Premium Dark Navy Background -->
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b" />
      <stop offset="60%" stop-color="#1c2541" />
      <stop offset="100%" stop-color="#0b132b" />
    </linearGradient>

    <!-- Elegant Soft Pastel Cyan-Purple Gradient -->
    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Border Accent Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Subtle Soft Glow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#38bdf8" flood-opacity="0.3" />
    </filter>

    <!-- Soft Geometric Grid -->
    <pattern id="softGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.08" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="900" height="240" rx="16" fill="url(#bannerBg)" stroke="url(#borderGrad)" stroke-width="1.5" />
  <rect width="900" height="240" rx="16" fill="url(#softGrid)" />

  <!-- Elegant Top Header Bar -->
  <rect x="0" y="0" width="900" height="38" rx="16" fill="#091124" fill-opacity="0.7" />
  <rect x="0" y="37" width="900" height="1" fill="url(#borderGrad)" opacity="0.4" />

  <!-- Smooth Window Dots -->
  <circle cx="28" cy="19" r="4.5" fill="#f87171" />
  <circle cx="44" cy="19" r="4.5" fill="#fbbf24" />
  <circle cx="60" cy="19" r="4.5" fill="#4ade80" />

  <text x="85" y="23" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#38bdf8" letter-spacing="1.5" font-weight="600">DISHA BODAR // PORTFOLIO CONSOLE</text>
  <text x="740" y="23" font-family="monospace" font-size="11" fill="#4ade80" letter-spacing="1">● STATUS: ACTIVE</text>

  <!-- Decorative Soft Tech Circles on Right -->
  <g transform="translate(760, 140)">
    <circle cx="0" cy="0" r="65" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="6 4" />
    <circle cx="0" cy="0" r="45" fill="none" stroke="#c084fc" stroke-width="1" stroke-opacity="0.25" />
    <circle cx="0" cy="0" r="6" fill="#38bdf8" opacity="0.8" />
  </g>

  <!-- Main Developer Name - Elegant, Friendly & Clean -->
  <text x="50" y="112" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', sans-serif" font-size="40" font-weight="700" fill="url(#titleGradient)" letter-spacing="0.5" filter="url(#softGlow)">Disha Bodar</text>

  <!-- Subtitle Professional Tagline -->
  <text x="52" y="148" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="500" fill="#cbd5e1" letter-spacing="0.5">
    B.Tech Information Technology • Aspiring AI/ML Engineer &amp; Full-Stack Developer
  </text>

  <!-- Friendly Motto / Intro -->
  <text x="52" y="178" font-family="'Segoe UI', sans-serif" font-size="13" fill="#38bdf8">
    ✦ Building intelligent applications &amp; modern software solutions
  </text>

  <!-- Clean Bottom Status Pills -->
  <g transform="translate(52, 198)">
    <rect width="140" height="26" rx="13" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <text x="70" y="17" font-family="sans-serif" font-size="11" fill="#38bdf8" text-anchor="middle" font-weight="600">🎓 B.Tech IT</text>
  </g>

  <g transform="translate(202, 198)">
    <rect width="160" height="26" rx="13" fill="#1e293b" stroke="#c084fc" stroke-width="1" />
    <text x="80" y="17" font-family="sans-serif" font-size="11" fill="#c084fc" text-anchor="middle" font-weight="600">🧠 AI / Machine Learning</text>
  </g>

  <g transform="translate(372, 198)">
    <rect width="160" height="26" rx="13" fill="#1e293b" stroke="#4ade80" stroke-width="1" />
    <text x="80" y="17" font-family="sans-serif" font-size="11" fill="#4ade80" text-anchor="middle" font-weight="600">💻 Full-Stack Development</text>
  </g>
</svg>
